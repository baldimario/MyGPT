[project]
name = "mygpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "baldimario", email = "mariobaldi.py@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.13.0",
    "numpy>=2.0",
    "pyarrow>=25.0.1",
    "regex>=2026.9.10",
]

[project.scripts]
mygpt = "mygpt:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
